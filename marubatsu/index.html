<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#ffd43b">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>にほんのルール ○×クイズ</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; touch-action: manipulation; }
  body {
    font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
    background: linear-gradient(160deg, #ffe066 0%, #ffa8a8 55%, #a5d8ff 100%);
    color: #343a40; user-select: none; -webkit-user-select: none; word-break: keep-all; overflow-wrap: anywhere; line-break: strict;
  }
  rt { font-size: 0.5em; color: #868e96; }
  .app { height: 100vh; height: 100dvh; display: flex; flex-direction: column; max-width: 480px; margin: 0 auto;
         padding: max(10px, env(safe-area-inset-top)) 14px max(10px, env(safe-area-inset-bottom)); }
  .screen { flex: 1; display: none; flex-direction: column; min-height: 0; }
  .screen.on { display: flex; }
  .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: clamp(13px, 3.6vw, 16px); min-height: 36px; }
  .top a { color: #fff; text-decoration: none; font-weight: bold; background: rgba(0,0,0,.18); padding: 6px 12px; border-radius: 99px; white-space: nowrap; }
  #scoreNow { font-weight: bold; background: rgba(255,255,255,.7); padding: 4px 12px; border-radius: 99px; visibility: hidden; }
  #snd { border: 0; background: rgba(255,255,255,.85); border-radius: 50%; width: 38px; height: 38px; font-size: 20px; padding: 0; cursor: pointer; box-shadow: 0 3px 0 rgba(0,0,0,.15); }
  #snd:active { transform: translateY(2px); }
  .btn { border: 0; border-radius: 22px; font-family: inherit; font-weight: bold; color: #fff; cursor: pointer;
         box-shadow: 0 6px 0 rgba(0,0,0,.2); transition: transform .08s; }
  .btn:active { transform: translateY(5px); box-shadow: 0 1px 0 rgba(0,0,0,.2); }
  .big { font-size: clamp(22px, 6.5vw, 30px); padding: clamp(12px, 2.6vh, 20px) 20px; width: 100%; }
  .green { background: #40c057; } .blue { background: #339af0; } .orange { background: #fd7e14; }

  /* start */
  #start { justify-content: space-between; text-align: center; }
  .title-box { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: clamp(6px, 1.5vh, 14px); min-height: 0; }
  .flag { font-size: clamp(52px, 12vh, 104px); animation: float 2.4s ease-in-out infinite; line-height: 1; }
  h1 { margin: 0; font-size: clamp(28px, 8.5vw, 40px); color: #fff; text-shadow: 0 3px 0 #e8590c, 0 0 14px rgba(0,0,0,.15); line-height: 1.25; }
  h1 .mb { display: inline-block; background: #fff; color: #e64980; border-radius: 16px; padding: 0 12px; text-shadow: none; margin-top: 6px; }
  .lead { background: rgba(255,255,255,.85); border-radius: 18px; padding: clamp(6px, 1.4vh, 14px) 16px; font-size: clamp(15px, 4.3vw, 19px); line-height: 1.7; }
  .emojirow { font-size: clamp(24px, 5.5vh, 40px); letter-spacing: 4px; }
  .note { font-size: clamp(11px, 3vw, 13px); color: #fff; margin-top: 8px; text-shadow: 0 1px 2px rgba(0,0,0,.25); }

  /* quiz */
  .progress { display: flex; gap: 5px; justify-content: center; margin: clamp(6px, 1.4vh, 12px) 0; }
  .dot { width: clamp(18px, 6vw, 26px); height: clamp(18px, 6vw, 26px); border-radius: 50%; background: rgba(255,255,255,.55);
         display: flex; align-items: center; justify-content: center; font-size: clamp(10px, 3vw, 14px); font-weight: bold; color: #fff; transition: all .3s; }
  .dot.now { background: #fff; color: #e64980; transform: scale(1.2); box-shadow: 0 0 0 3px #f783ac; }
  .dot.ok { background: #40c057; } .dot.ng { background: #fa5252; }
  .card { flex: 1; min-height: 0; background: #fff; border-radius: 28px; box-shadow: 0 8px 0 rgba(0,0,0,.12);
          display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
          padding: clamp(10px, 2vh, 20px) 16px; position: relative; overflow: hidden; }
  .qhead { display: flex; gap: 8px; align-items: center; justify-content: center; flex-wrap: wrap; }
  .qno { font-size: clamp(14px, 4vw, 18px); color: #f06595; font-weight: bold; }
  .cat { font-size: clamp(12px, 3.4vw, 15px); font-weight: bold; color: #fff; padding: 3px 10px; border-radius: 99px; animation: pop .4s; }
  .qemoji { font-size: clamp(52px, 12vh, 104px); line-height: 1.1; margin: clamp(4px, 1vh, 10px) 0; }
  .qtext { font-size: clamp(19px, 5.6vw, 26px); font-weight: bold; line-height: 1.75; }
  .card.fresh .qemoji { animation: pop .45s; }
  .answers { display: flex; gap: 14px; margin-top: clamp(10px, 2vh, 18px); height: clamp(96px, 19vh, 160px); }
  .answers .btn { flex: 1; font-size: clamp(60px, 13vh, 110px); line-height: 1; padding: 0; border-radius: 28px; }
  .maru { background: #ff6b6b; } .batsu { background: #4dabf7; }
  .answers.hide { display: none; }

  /* feedback */
  .fb { display: none; flex-direction: column; gap: clamp(8px, 1.6vh, 14px); margin-top: clamp(10px, 2vh, 18px); }
  .fb.on { display: flex; }
  .fbcard { border-radius: 24px; padding: clamp(8px, 1.6vh, 14px) 14px; text-align: center; color: #fff; }
  .fbcard.ok { background: #40c057; animation: pop .5s; } .fbcard.ng { background: #fa5252; animation: shake .5s; }
  .fbtitle { font-size: clamp(24px, 7vw, 34px); font-weight: bold; }
  .fbans { font-size: clamp(14px, 4vw, 18px); }
  .fbexp { font-size: clamp(15px, 4.3vw, 19px); line-height: 1.7; background: rgba(255,255,255,.95); color: #343a40; border-radius: 14px; padding: 6px 10px; margin-top: 6px; }
  .fb .btn { font-size: clamp(20px, 6vw, 28px); padding: clamp(10px, 2vh, 16px); }
  .card.ok { animation: bounce .6s; } .card.ng { animation: shake .5s; }

  /* result */
  #result { text-align: center; justify-content: space-between; }
  .rbox { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: clamp(6px, 1.4vh, 12px);
          background: #fff; border-radius: 28px; margin: 10px 0; padding: 12px; box-shadow: 0 8px 0 rgba(0,0,0,.12); min-height: 0; }
  .remoji { font-size: clamp(64px, 15vh, 120px); line-height: 1.1; animation: pop .8s; }
  .score { font-size: clamp(20px, 6vw, 28px); font-weight: bold; }
  .score b { font-size: 2em; color: #e64980; }
  .rank { font-size: clamp(22px, 6.5vw, 30px); font-weight: bold; color: #fd7e14; }
  .rmsg { font-size: clamp(15px, 4.3vw, 19px); line-height: 1.7; }
  .stars { font-size: clamp(22px, 6vw, 30px); letter-spacing: 2px; }
  .rbtns { display: flex; flex-direction: column; gap: 12px; }
  .link { display: block; text-align: center; color: #fff; font-weight: bold; font-size: clamp(14px, 4vw, 17px); text-decoration: none; padding: 6px; }

  .confetti { position: fixed; top: -20px; width: 10px; height: 14px; pointer-events: none; z-index: 9; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); opacity: .7; } }
  @keyframes float { 0%,100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-12px) rotate(4deg); } }
  @keyframes pop { 0% { transform: scale(.3); } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }
  @keyframes bounce { 0%,100% { transform: translateY(0); } 30% { transform: translateY(-14px); } 60% { transform: translateY(4px); } }
  @keyframes shake { 0%,100% { transform: translateX(0); } 20%,60% { transform: translateX(-10px); } 40%,80% { transform: translateX(10px); } }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <a href="../" data-tap>← いちらん</a>
    <span id="scoreNow">⭐ 0</span>
    <button id="snd" aria-label="おと">🔊</button>
  </div>

  <section class="screen on" id="start">
    <div class="title-box">
      <div class="flag">🗾</div>
      <h1>にほんの ルール<br><span class="mb">⭕❌ クイズ</span></h1>
      <div class="emojirow">👟🚃🍜♨️🎍</div>
      <div class="lead">
        <ruby>日本<rt>にほん</rt></ruby>の くらしの ルールを<br>クイズで おぼえよう！<br>
        ぜんぶで <b>10もん</b> だよ。
      </div>
    </div>
    <div>
      <button class="btn big green" id="startBtn">▶ スタート！</button>
      <div class="note">🔊 おとが でない ときは、マナーモードを オフに してね</div>
    </div>
  </section>

  <section class="screen" id="quiz">
    <div class="progress" id="progress"></div>
    <div class="card" id="card">
      <div class="qhead"><span class="qno" id="qno">だい1もん</span><span class="cat" id="cat"></span></div>
      <div class="qemoji" id="qemoji">👟</div>
      <div class="qtext" id="qtext"></div>
    </div>
    <div class="answers" id="answers">
      <button class="btn maru" data-a="1" aria-label="まる">⭕</button>
      <button class="btn batsu" data-a="0" aria-label="ばつ">❌</button>
    </div>
    <div class="fb" id="fb">
      <div class="fbcard" id="fbcard">
        <div class="fbtitle" id="fbtitle"></div>
        <div class="fbans" id="fbans"></div>
        <div class="fbexp" id="fbexp"></div>
      </div>
      <button class="btn orange" id="nextBtn">つぎへ ▶</button>
    </div>
  </section>

  <section class="screen" id="result">
    <div class="rbox">
      <div class="remoji" id="remoji">🏆</div>
      <div class="score">10もん<ruby>中<rt>ちゅう</rt></ruby> <b id="rscore">0</b>もん せいかい！</div>
      <div class="stars" id="stars"></div>
      <div class="rank" id="rank"></div>
      <div class="rmsg" id="rmsg"></div>
    </div>
    <div class="rbtns">
      <button class="btn big blue" id="againBtn">🔁 もういちど</button>
      <a class="link" href="../" data-tap>🏠 アプリいちらんへ もどる</a>
    </div>
  </section>
</div>
<script>
// {漢字|よみ} → ルビ
const R = s => s.replace(/\{([^|}]+)\|([^}]+)\}/g, '<ruby>$1<rt>$2</rt></ruby>');

const CATS = {
  ie:     ['🏠 いえ', '#f59f00'],
  tabe:   ['🍙 たべもの', '#e8590c'],
  michi:  ['🚃 でんしゃ・みち', '#1c7ed6'],
  mise:   ['🏪 おみせ', '#ae3ec9'],
  gakko:  ['🏫 がっこう', '#2f9e44'],
  gomi:   ['🗑️ ごみ', '#5c940d'],
  onsen:  ['♨️ おんせん・おふろ', '#e64980'],
  anzen:  ['🆘 あんぜん・さいがい', '#c92a2a'],
  okane:  ['💴 おかね', '#f08c00'],
  kisetsu:['🎍 ぎょうじ・きせつ', '#0ca678'],
  aisatsu:['🙇 あいさつ', '#7048e8'],
};

// a: 1 = ⭕ / 0 = ❌
const POOL = [
  // いえ
  { c: 'ie', e: '👟', q: '{家|いえ}に {入|はい}るとき、くつを ぬぐ。', a: 1, x: '{家|いえ}の {中|なか}は くつを ぬいで すごすよ。' },
  { c: 'ie', e: '🩴', q: '{家|いえ}の トイレでは、トイレの スリッパに はきかえる ことが ある。', a: 1, x: 'トイレ{用|よう}の スリッパが ある {家|いえ}も おおいよ。' },
  { c: 'ie', e: '🟩', q: 'たたみの {上|うえ}は、くつで あるいて いい。', a: 0, x: 'たたみの {上|うえ}は くつを ぬいで あるくよ。' },
  { c: 'ie', e: '🌙', q: 'アパートでは、よる おそくに {大|おお}きい おとを だしても いい。', a: 0, x: 'となりの {人|ひと}が ねて いるよ。よるは しずかに しよう。' },
  { c: 'ie', e: '🚽', q: 'トイレットペーパーは、トイレに ながす。', a: 1, x: '{日本|にほん}の トイレは かみを ながして だいじょうぶ。' },
  { c: 'ie', e: '👞', q: 'ぬいだ くつは、そろえて おくと よい。', a: 1, x: 'くつを そろえると、げんかんが きれいに なるよ。' },
  // たべもの
  { c: 'tabe', e: '🍚', q: 'ごはんに おはしを たてて さしても いい。', a: 0, x: 'おはしを ごはんに たてるのは よくない マナーだよ。' },
  { c: 'tabe', e: '🍜', q: 'ラーメンを ズズッと おとを たてて たべても いい。', a: 1, x: 'めんを すする おとは だいじょうぶ。' },
  { c: 'tabe', e: '🙏', q: 'たべる まえに「いただきます」と いう。', a: 1, x: 'たべものや つくった {人|ひと}に「ありがとう」の きもちだよ。' },
  { c: 'tabe', e: '🥢', q: 'おはしから おはしへ、たべものを わたしても いい。', a: 0, x: 'おはしで わたすのは よくない マナーだよ。おさらに おこう。' },
  { c: 'tabe', e: '😋', q: 'たべおわったら「ごちそうさま」と いう。', a: 1, x: '「おいしかった、ありがとう」の きもちだよ。' },
  { c: 'tabe', e: '🍣', q: 'おすしは、{手|て}で たべても いい。', a: 1, x: 'おすしは {手|て}でも おはしでも だいじょうぶ。' },
  // でんしゃ・みち
  { c: 'michi', e: '📱', q: 'でんしゃの {中|なか}で、{大|おお}きい こえで でんわを しても いい。', a: 0, x: 'でんしゃの {中|なか}では でんわは しないで、しずかに しよう。' },
  { c: 'michi', e: '🚗', q: '{日本|にほん}では、{車|くるま}は みちの ひだりがわを はしる。', a: 1, x: '{車|くるま}は ひだりがわ。わたる ときは {右|みぎ}も {左|ひだり}も よく みてね。' },
  { c: 'michi', e: '🚦', q: 'しんごうが {赤|あか}でも、{車|くるま}が いなければ わたって いい。', a: 0, x: '{赤|あか}は とまれ！ {青|あお}に なるまで まとう。' },
  { c: 'michi', e: '🧍', q: 'えきで でんしゃを まつ ときは、ならんで まつ。', a: 1, x: 'じゅんばんに ならんで まとう。' },
  { c: 'michi', e: '💺', q: 'でんしゃの「ゆうせんせき」は、おとしよりなどに ゆずる せき。', a: 1, x: 'こまって いる {人|ひと}に せきを ゆずろう。' },
  { c: 'michi', e: '🚲', q: 'じてんしゃは、みちの みぎがわを はしる。', a: 0, x: 'じてんしゃも {車|くるま}と おなじで ひだりがわを はしるよ。' },
  { c: 'michi', e: '🚃', q: 'でんしゃが きたら、おりる {人|ひと}より さきに のる。', a: 0, x: 'おりる {人|ひと}が さき。そのあとで のろう。' },
  { c: 'michi', e: '🤳', q: 'じてんしゃに のりながら、スマホを つかっても いい。', a: 0, x: 'とても あぶないから、ほうりつで だめだよ。' },
  // おみせ
  { c: 'mise', e: '💴', q: 'レストランでは、チップを わたす。', a: 0, x: '{日本|にほん}では チップは いらないよ。' },
  { c: 'mise', e: '💧', q: 'レストランの おみずは、ただ（むりょう）の ことが おおい。', a: 1, x: 'おみずや おちゃは ただの お{店|みせ}が おおいよ。' },
  { c: 'mise', e: '🍱', q: 'コンビニでは、おべんとうを あたためて もらえる ことが ある。', a: 1, x: 'レジで「あたためますか？」と きかれる ことが あるよ。' },
  { c: 'mise', e: '🏷️', q: 'お{店|みせ}では、ねだんを やすく して もらうのが ふつう。', a: 0, x: 'ふつうは ねだんの とおりに はらうよ。' },
  { c: 'mise', e: '🍬', q: 'おかしは、かう まえに お{店|みせ}で あけて たべても いい。', a: 0, x: 'おかねを はらってから あけようね。' },
  // がっこう
  { c: 'gakko', e: '🌸', q: '{日本|にほん}の がっこうは、4{月|がつ}に はじまる。', a: 1, x: 'さくらの きせつに にゅうがくしきが あるよ。' },
  { c: 'gakko', e: '🧹', q: '{日本|にほん}の しょうがっこうでは、そうじは そうじの {人|ひと}だけが する。', a: 0, x: '{子|こ}どもたちも きょうしつを そうじするよ。' },
  { c: 'gakko', e: '🍛', q: 'きゅうしょくは、{子|こ}どもが じゅんばんに くばる ことが おおい。', a: 1, x: '「きゅうしょく とうばん」が みんなに くばるよ。' },
  { c: 'gakko', e: '🎒', q: '{日本|にほん}の しょうがっこうは、5{年生|ねんせい}まで。', a: 0, x: 'しょうがっこうは 6{年生|ねんせい}まで あるよ。' },
  { c: 'gakko', e: '👟', q: 'がっこうの {中|なか}では、うわばきに はきかえる ことが おおい。', a: 1, x: 'そとの くつと、{中|なか}の くつを わけるよ。' },
  // ごみ
  { c: 'gomi', e: '🗑️', q: 'ごみは しゅるいで わけて、きまった {日|ひ}に だす。', a: 1, x: 'もえる ごみ、プラスチックなど、わけて だすよ。' },
  { c: 'gomi', e: '🚮', q: '{日本|にほん}の まちには、ごみばこが たくさん ある。', a: 0, x: 'ごみばこは すくないよ。ごみは {家|いえ}に もって かえろう。' },
  { c: 'gomi', e: '🧴', q: 'ペットボトルは、もえる ごみと いっしょに だしても いい。', a: 0, x: 'ペットボトルは わけて だすよ。' },
  { c: 'gomi', e: '🚯', q: 'ごみを みちに すてても いい。', a: 0, x: 'ポイすては だめ！ まちを きれいに しよう。' },
  { c: 'gomi', e: '🛋️', q: '{大|おお}きい ごみ（そだいごみ）は、もうしこんでから だす ことが おおい。', a: 1, x: 'ソファなどは、まえに れんらくしてから だすよ。' },
  // おんせん・おふろ
  { c: 'onsen', e: '♨️', q: 'おんせんでは、からだを あらってから おゆに はいる。', a: 1, x: 'さきに からだを あらうのが ルールだよ。' },
  { c: 'onsen', e: '🧺', q: 'おんせんの おゆに タオルを いれても いい。', a: 0, x: 'タオルは おゆに いれないよ。' },
  { c: 'onsen', e: '🩱', q: 'おんせんには、みずぎを きて はいる ことが おおい。', a: 0, x: 'ふつうは はだかで はいるよ。' },
  { c: 'onsen', e: '🧼', q: 'おふろの おゆの {中|なか}で、せっけんで からだを あらう。', a: 0, x: 'からだは おゆの そとで あらうよ。' },
  { c: 'onsen', e: '🏊', q: 'おんせんでは、およがない。', a: 1, x: 'みんなの おふろだから、しずかに はいろう。' },
  // あんぜん・さいがい
  { c: 'anzen', e: '🚑', q: 'きゅうきゅうしゃを よぶ でんわばんごうは「119」。', a: 1, x: 'けがや びょうきで たいへんな ときは 119 だよ。' },
  { c: 'anzen', e: '👮', q: 'けいさつを よぶ でんわばんごうは「119」。', a: 0, x: 'けいさつは「110」だよ。' },
  { c: 'anzen', e: '🌏', q: '{日本|にほん}は じしんが おおい くに。', a: 1, x: 'だから、じしんの くんれんを よく するよ。' },
  { c: 'anzen', e: '🪑', q: 'じしんで ゆれたら、つくえの {下|した}に はいって あたまを まもる。', a: 1, x: 'あたまを まもるのが いちばん だいじ！' },
  { c: 'anzen', e: '🔥', q: 'かじの ときは、エレベーターで にげる。', a: 0, x: 'エレベーターは とまる かも。かいだんで にげよう。' },
  { c: 'anzen', e: '🌊', q: 'つなみの けいほうが でたら、たかい ところへ にげる。', a: 1, x: 'うみから はなれて、たかい ところへ いそごう。' },
  { c: 'anzen', e: '🍺', q: '{日本|にほん}では、18さいに なったら おさけを のんで いい。', a: 0, x: 'おさけは 20さいに なってから だよ。' },
  // おかね
  { c: 'okane', e: '🏥', q: 'きゅうきゅうしゃを よぶと、おかねが かかる。', a: 0, x: 'きゅうきゅうしゃは ただだよ。でも ひつような ときだけ よぼう。' },
  { c: 'okane', e: '💴', q: '{日本|にほん}の おかねは「{円|えん}」。', a: 1, x: '100{円|えん}、1000{円|えん}の ように かぞえるよ。' },
  { c: 'okane', e: '💵', q: '1000{円|えん}、5000{円|えん}、1{万|まん}{円|えん}の おさつには、{人|ひと}の かおが ある。', a: 1, x: 'むかしの ゆうめいな {人|ひと}の かおだよ。' },
  { c: 'okane', e: '🪙', q: '1{円|えん}だまは、きんいろ。', a: 0, x: '1{円|えん}だまは ぎんいろ。きんいろは 5{円|えん}だまだよ。' },
  { c: 'okane', e: '👛', q: 'さいふを ひろったら、こうばん（けいさつ）に とどける。', a: 1, x: 'おとした {人|ひと}が こまって いるよ。とどけよう。' },
  // ぎょうじ・きせつ
  { c: 'kisetsu', e: '🧧', q: 'おしょうがつに、{子|こ}どもは「おとしだま」を もらう ことが ある。', a: 1, x: 'おとしだまは、おしょうがつの おこづかいだよ。' },
  { c: 'kisetsu', e: '🎍', q: '{日本|にほん}の おしょうがつは、2{月|がつ}1{日|にち}。', a: 0, x: 'おしょうがつは 1{月|がつ}1{日|にち}だよ。' },
  { c: 'kisetsu', e: '🌸', q: 'はるに、さくらを みる「おはなみ」を する。', a: 1, x: 'さくらの {下|した}で ごはんを たべたり するよ。' },
  { c: 'kisetsu', e: '👹', q: 'せつぶんには、まめを まいて「おには そと、ふくは うち」と いう。', a: 1, x: 'わるい ものを おいだす ぎょうじだよ。' },
  { c: 'kisetsu', e: '☀️', q: '{日本|にほん}の なつは、とても さむい。', a: 0, x: 'なつは とても あつい！ みずを のもう。' },
  { c: 'kisetsu', e: '🎏', q: '「こどもの{日|ひ}」は、5{月|がつ}5{日|か}。', a: 1, x: 'こいのぼりを かざる {日|ひ}だよ。' },
  { c: 'kisetsu', e: '🎄', q: '12{月|がつ}25{日|にち}（クリスマス）は、{日本|にほん}の やすみの {日|ひ}（しゅくじつ）。', a: 0, x: 'クリスマスは しゅくじつでは ないよ。' },
  // あいさつ
  { c: 'aisatsu', e: '🙇', q: 'あいさつの とき、おじぎを する ことが ある。', a: 1, x: 'あたまを さげて「こんにちは」。' },
  { c: 'aisatsu', e: '🌅', q: 'あさ、{人|ひと}に あったら「こんばんは」と いう。', a: 0, x: 'あさは「おはよう ございます」だよ。' },
  { c: 'aisatsu', e: '🙏', q: 'あやまる とき、「すみません」と いう ことが ある。', a: 1, x: '「ごめんなさい」や「すみません」と いうよ。' },
];

const N = 10;
let qs = [], idx = 0, score = 0, results = [];
const $ = id => document.getElementById(id);
const show = id => {
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id));
  $('scoreNow').style.visibility = id === 'quiz' ? 'visible' : 'hidden';
};

/* ================= サウンド（WebAudio でつくる） ================= */
const Snd = (() => {
  let ac = null, master, sfx, bgm, noiseBuf;
  let on = true, bgmTimer = null, bgmStep = 0, nextT = 0, bgmWanted = false;
  try { on = localStorage.getItem('marubatsu-sound') !== 'off'; } catch (e) {}
  const BGM_VOL = 0.22;

  function init() {
    if (ac) { if (ac.state !== 'running') ac.resume().catch(() => {}); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      ac = new AC();
      master = ac.createGain(); master.gain.value = on ? 0.8 : 0; master.connect(ac.destination);
      sfx = ac.createGain(); sfx.gain.value = 1; sfx.connect(master);
      bgm = ac.createGain(); bgm.gain.value = BGM_VOL; bgm.connect(master);
      // iOS のロックかいじょ用：むおんを ならす
      const b = ac.createBuffer(1, 1, 22050), s = ac.createBufferSource();
      s.buffer = b; s.connect(ac.destination); s.start(0);
      noiseBuf = ac.createBuffer(1, ac.sampleRate * 0.5, ac.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      if (ac.state !== 'running') ac.resume().catch(() => {});
      document.addEventListener('visibilitychange', () => {
        if (!ac) return;
        if (document.hidden) ac.suspend().catch(() => {}); else if (on) ac.resume().catch(() => {});
      });
    } catch (e) { ac = null; }
  }
  const ok = () => ac && on;

  function tone(f, t, dur, { type = 'sine', vol = 0.3, attack = 0.005, dest = sfx, slideTo = 0 } = {}) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(dest); o.start(t); o.stop(t + dur + 0.05);
  }
  // ベルの おと（きほん + ばいおん）
  function bell(f, t, dur, vol = 0.28) {
    tone(f, t, dur, { vol });
    tone(f * 2, t, dur * 0.6, { vol: vol * 0.35 });
    tone(f * 3, t, dur * 0.35, { vol: vol * 0.15 });
    tone(f * 4.2, t, dur * 0.15, { vol: vol * 0.08 });
  }
  function duck(sec) {
    if (!ac) return;
    const t = ac.currentTime, g = bgm.gain;
    g.cancelScheduledValues(t); g.setValueAtTime(g.value, t);
    g.linearRampToValueAtTime(BGM_VOL * 0.2, t + 0.05);
    g.setValueAtTime(BGM_VOL * 0.2, t + sec);
    g.linearRampToValueAtTime(BGM_VOL, t + sec + 0.4);
  }

  const E6 = 1318.5, C6 = 1046.5;
  const fx = {
    tap() { const t = ac.currentTime; tone(900, t, 0.07, { vol: 0.25, slideTo: 380 }); },
    // ピンポンピンポーン
    correct() {
      duck(1.4); const t = ac.currentTime + 0.01;
      bell(E6, t, 0.35); bell(C6, t + 0.17, 0.4);
      bell(E6, t + 0.42, 0.35); bell(C6, t + 0.59, 0.9);
    },
    // ブブー
    wrong() {
      duck(1.1); const t = ac.currentTime + 0.01;
      const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1400; lp.connect(sfx);
      [[0, 0.16], [0.21, 0.6]].forEach(([s, d]) => {
        [125, 128.5].forEach((f, i) => {
          const o = ac.createOscillator(), g = ac.createGain();
          o.type = i ? 'sawtooth' : 'square'; o.frequency.value = f;
          g.gain.setValueAtTime(0.0001, t + s);
          g.gain.exponentialRampToValueAtTime(0.16, t + s + 0.01);
          g.gain.setValueAtTime(0.16, t + s + d - 0.04);
          g.gain.exponentialRampToValueAtTime(0.0001, t + s + d);
          o.connect(g); g.connect(lp); o.start(t + s); o.stop(t + s + d + 0.05);
        });
      });
    },
    start() {
      duck(1.2); const t = ac.currentTime + 0.01;
      [523.3, 659.3, 784, 1046.5].forEach((f, i) => tone(f, t + i * 0.09, 0.18, { type: 'square', vol: 0.12 }));
      bell(1568, t + 0.38, 0.6, 0.18);
    },
    whoosh() {
      const t = ac.currentTime, s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
      s.buffer = noiseBuf; f.type = 'bandpass'; f.Q.value = 1.2;
      f.frequency.setValueAtTime(400, t); f.frequency.exponentialRampToValueAtTime(3500, t + 0.3);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.25, t + 0.08); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.32);
      s.connect(f); f.connect(g); g.connect(sfx); s.start(t); s.stop(t + 0.35);
    },
    fanfareHigh() {
      const t = ac.currentTime + 0.05;
      const n = [[784, 0, .12], [784, .14, .12], [784, .28, .12], [1046.5, .42, .5], [932.3, .95, .2], [1046.5, 1.17, .2], [1318.5, 1.4, .8]];
      n.forEach(([f, s, d]) => { tone(f, t + s, d + 0.1, { type: 'square', vol: 0.12 }); tone(f / 2, t + s, d + 0.1, { type: 'triangle', vol: 0.18 }); });
      [523.3, 659.3, 784].forEach(f => tone(f, t + 1.4, 1.0, { type: 'triangle', vol: 0.1 }));
      bell(2093, t + 1.4, 1.0, 0.12);
    },
    fanfareLow() {
      const t = ac.currentTime + 0.05;
      [[523.3, 0], [659.3, .25], [784, .5], [1046.5, .8]].forEach(([f, s]) => bell(f, t + s, 0.8, 0.18));
    },
  };
  function play(name) { if (!ok()) return; try { fx[name](); } catch (e) {} }

  // BGM：ペンタトニックの げんきな メロディ（ド レ ミ ソ ラ）
  const M = { C5: 523.3, D5: 587.3, E5: 659.3, G5: 784, A5: 880, C6: 1046.5, D6: 1174.7, A4: 440, G4: 392 };
  const B = { C3: 130.8, G2: 98, A2: 110, F2: 87.3, D3: 146.8, E3: 164.8 };
  const MEL = ['E5','G5','A5','G5','E5','D5','C5','D5', 'E5','G5','E5','D5','C5',null,'C5',null,
               'A5','C6','A5','G5','E5','G5','A5',null, 'G5','E5','D5','E5','C5',null,null,null];
  const BASS = ['C3','G2','A2','E3', 'F2','C3','G2','G2'];
  const STEP = 0.16; // 8ぶおんぷ
  function sched() {
    while (nextT < ac.currentTime + 0.25) {
      const i = bgmStep % MEL.length, m = MEL[i];
      if (m) tone(M[m], nextT, STEP * 0.9, { type: 'square', vol: 0.06, dest: bgm });
      if (i % 4 === 0) tone(B[BASS[(i / 4) % BASS.length]], nextT, STEP * 3.6, { type: 'triangle', vol: 0.22, dest: bgm });
      if (i % 2 === 1) { // ハイハット
        const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
        s.buffer = noiseBuf; f.type = 'highpass'; f.frequency.value = 7000;
        g.gain.setValueAtTime(0.05, nextT); g.gain.exponentialRampToValueAtTime(0.0001, nextT + 0.04);
        s.connect(f); f.connect(g); g.connect(bgm); s.start(nextT); s.stop(nextT + 0.05);
      }
      nextT += STEP; bgmStep++;
    }
  }
  function bgmStart() {
    bgmWanted = true;
    if (!ok() || bgmTimer) return;
    bgmStep = 0; nextT = ac.currentTime + 0.6;
    bgmTimer = setInterval(() => { try { sched(); } catch (e) {} }, 60);
  }
  function bgmStop() { bgmWanted = false; if (bgmTimer) { clearInterval(bgmTimer); bgmTimer = null; } }

  function setOn(v) {
    on = v;
    try { localStorage.setItem('marubatsu-sound', on ? 'on' : 'off'); } catch (e) {}
    $('snd').textContent = on ? '🔊' : '🔇';
    if (ac) {
      master.gain.setTargetAtTime(on ? 0.8 : 0, ac.currentTime, 0.02);
      if (on) { ac.resume().catch(() => {}); if (bgmWanted) { const w = bgmWanted; bgmStop(); if (w) bgmStart(); } }
      else if (bgmTimer) { clearInterval(bgmTimer); bgmTimer = null; }
    }
  }
  return { init, play, bgmStart, bgmStop, setOn, get on() { return on; }, get ctx() { return ac; } };
})();
$('snd').textContent = Snd.on ? '🔊' : '🔇';

// さいしょの タップで AudioContext を つくる（iOS の ルール）
const unlock = () => Snd.init();
['pointerdown', 'touchend', 'click'].forEach(ev => document.addEventListener(ev, unlock, { capture: true, passive: true }));

const buzz = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };

function confetti(n = 40) {
  const colors = ['#ff6b6b','#ffd43b','#51cf66','#339af0','#cc5de8','#ff922b'];
  for (let i = 0; i < n; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = colors[i % colors.length];
    c.style.animationDuration = (1.2 + Math.random() * 1.3) + 's';
    c.style.animationDelay = (Math.random() * 0.3) + 's';
    c.style.borderRadius = Math.random() < .5 ? '50%' : '2px';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 3000);
  }
}

function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

// カテゴリが かたよらない ように えらぶ
function pick() {
  const by = {};
  shuffle(POOL).forEach(q => (by[q.c] = by[q.c] || []).push(q));
  const out = [];
  let cats = shuffle(Object.keys(by));
  while (out.length < N) {
    for (const c of cats) { if (out.length < N && by[c].length) out.push(by[c].pop()); }
    cats = shuffle(cats);
  }
  return shuffle(out);
}

function startGame() {
  qs = pick(); idx = 0; score = 0; results = [];
  Snd.init(); Snd.play('start'); Snd.bgmStart();
  show('quiz'); render();
}

function renderDots() {
  $('progress').innerHTML = qs.map((_, i) => {
    const cls = i < results.length ? (results[i] ? 'ok' : 'ng') : (i === idx ? 'now' : '');
    const t = i < results.length ? (results[i] ? '○' : '×') : i + 1;
    return `<div class="dot ${cls}">${t}</div>`;
  }).join('');
}

function render() {
  const q = qs[idx], cat = CATS[q.c];
  $('qno').textContent = `だい${idx + 1}もん`;
  $('cat').textContent = cat[0];
  $('cat').style.background = cat[1];
  $('cat').style.animation = 'none'; void $('cat').offsetWidth; $('cat').style.animation = '';
  $('qemoji').textContent = q.e;
  $('qtext').innerHTML = R(q.q);
  $('scoreNow').textContent = '⭐ ' + score;
  $('card').className = 'card'; void $('card').offsetWidth; $('card').className = 'card fresh';
  $('answers').classList.remove('hide');
  $('fb').classList.remove('on');
  renderDots();
}

function answer(a) {
  if ($('answers').classList.contains('hide')) return;
  const q = qs[idx], ok = a === q.a;
  results.push(ok); if (ok) score++;
  $('answers').classList.add('hide');
  $('fbcard').className = 'fbcard ' + (ok ? 'ok' : 'ng');
  $('fbtitle').textContent = ok ? '🎉 ピンポーン！ せいかい！' : '😢 ブブー！ ざんねん…';
  $('fbans').textContent = 'こたえは ' + (q.a ? '⭕（まる）' : '❌（ばつ）');
  $('fbexp').innerHTML = R(q.x);
  $('nextBtn').textContent = idx === N - 1 ? 'けっかを みる 🏁' : 'つぎへ ▶';
  $('fb').classList.add('on');
  $('card').className = 'card ' + (ok ? 'ok' : 'ng');
  $('scoreNow').textContent = '⭐ ' + score;
  renderDots();
  if (ok) { confetti(); Snd.play('correct'); buzz(40); }
  else { Snd.play('wrong'); buzz([60, 40, 60]); }
}

function next() {
  idx++;
  if (idx < N) { render(); Snd.play('whoosh'); }
  else finish();
}

function finish() {
  const s = score;
  const ranks = [
    [10, '🏆', 'にほんの ルール はかせ！', 'ぜんもん せいかい！ すごすぎる！'],
    [8, '🥇', 'にほん マスター！', 'とても よく しって いるね！'],
    [6, '🥈', 'いい ちょうし！', 'あと すこしで マスターだよ！'],
    [4, '🥉', 'がんばったね！', 'もういちど やると もっと わかるよ。'],
    [0, '🌱', 'いっしょに おぼえよう！', 'まちがえても だいじょうぶ。もういちど チャレンジ！'],
  ];
  const r = ranks.find(r => s >= r[0]);
  $('rscore').textContent = s;
  $('remoji').textContent = r[1];
  $('rank').textContent = r[2];
  $('rmsg').textContent = r[3];
  $('stars').textContent = '⭐'.repeat(Math.round(s / 2)) + '☆'.repeat(5 - Math.round(s / 2));
  show('result');
  Snd.bgmStop();
  if (s >= 6) { confetti(80); Snd.play('fanfareHigh'); } else Snd.play('fanfareLow');
}

// ボタンを おしたら「ポッ」
document.addEventListener('click', e => { if (e.target.closest('.btn, [data-tap]')) Snd.play('tap'); }, true);
$('snd').onclick = () => { Snd.init(); Snd.setOn(!Snd.on); if (Snd.on) Snd.play('tap'); };
$('startBtn').onclick = startGame;
$('againBtn').onclick = startGame;
$('nextBtn').onclick = next;
document.querySelectorAll('#answers .btn').forEach(b => b.onclick = () => answer(+b.dataset.a));
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
</script>
